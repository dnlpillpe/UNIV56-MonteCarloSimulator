name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.35.4"

jobs:
  content-and-static:
    name: Contenido y verificación estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar parser de Dart (tree-sitter)
        run: pip install tree-sitter tree-sitter-language-pack
      - name: Integridad del contenido (cifras, confusiones, referencias)
        run: python3 tool/verify_content.py
      - name: Verificación estática (sintaxis, imports, argumentos)
        run: python3 tool/static_check.py

  analyze-and-test:
    name: Analizar y probar
    runs-on: ubuntu-latest
    needs: content-and-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generar plataformas (no se versionan)
        run: flutter create --platforms=android,ios --org com.educationalfactory --project-name monte_carlo_simulator .
      - name: Ajustes posteriores
        run: python3 tool/postcreate.py
      - run: flutter pub get
      - name: Icono de la app
        run: dart run flutter_launcher_icons
      - name: Análisis estático
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas
        run: flutter test --reporter expanded
